spring.application.name=School Management System

server.address=0.0.0.0
server.port=8080

########################################

# MySQL

########################################

# Set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables before running.
# Do NOT commit real credentials to this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_db}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:1234}

# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

########################################

# spring.datasource.url=jdbc:sqlite:./data/school.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect


# Hibernate

########################################

# NOTE: 'update' auto-alters the schema and is convenient for development,
# but is risky for production (no rollback, possible data loss on schema
# drift). Before deploying, switch to a migration tool (Flyway/Liquibase)
# and set this to 'validate'.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

########################################

# Thymeleaf

########################################

spring.thymeleaf.cache=false

########################################

# ================================
# File Upload
# ================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

