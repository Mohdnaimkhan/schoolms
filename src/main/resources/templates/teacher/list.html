<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <!-- =========================
             Page Header
        ========================== -->

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-person-workspace me-2"></i>

                    Teachers

                </h2>

                <p class="text-secondary mb-0">

                    Manage all teachers.

                </p>

            </div>

            <a th:href="@{/teachers/add}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle me-2"></i>

                Add Teacher

            </a>

        </div>

        <div class="row g-4 module-stat-grid">
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-primary"><i class="bi bi-people-fill"></i></div><div class="module-stat-body"><span class="module-stat-label">Total Teachers</span><strong class="module-stat-value" th:text="${teacherTotal}">0</strong><small class="module-stat-meta">All teachers</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-success"><i class="bi bi-person-check-fill"></i></div><div class="module-stat-body"><span class="module-stat-label">Active Teachers</span><strong class="module-stat-value" th:text="${teacherActive}">0</strong><small class="module-stat-meta">Currently active</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-info"><i class="bi bi-gender-male"></i></div><div class="module-stat-body"><span class="module-stat-label">Male</span><strong class="module-stat-value" th:text="${teacherMale}">0</strong><small class="module-stat-meta">Male teachers</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-danger"><i class="bi bi-gender-female"></i></div><div class="module-stat-body"><span class="module-stat-label">Female</span><strong class="module-stat-value" th:text="${teacherFemale}">0</strong><small class="module-stat-meta">Female teachers</small></div></div></div>
</div>
<!-- =========================
                Search
        ========================== -->

        <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>
    <div class="card-header"><i class="bi bi-funnel-fill me-2"></i>Search &amp; Filters</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-lg-7 col-md-8">
          <label class="form-label fw-semibold">Search teacher</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control module-search-input" placeholder="Type to search..." autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn-outline-secondary module-search-clear" title="Clear search"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
        <div class="col-lg-3 col-md-4"><div class="small text-secondary module-search-count"></div></div>
        <div class="col-lg-2"><button type="button" class="btn btn-primary w-100 module-search-focus"><i class="bi bi-search me-1"></i>Search</button></div>
      </div>
    </div>
  </div>

  <table class="table table-hover align-middle mb-0" data-module-search-table>

                    <thead>

                    <tr>

                        <th>#</th>

                        <th>Photo</th>

                        <th>Code</th>
                        <th>TEN No.</th>

                        <th>Name</th>

                        <th>Mobile</th>

                        <th>Subject</th>

                        <th>Joining</th>

                        <th>Status</th>

                        <th width="170">

                            Action

                        </th>

                    </tr>

                    </thead>

                    <tbody id="teacherTable">

                    <tr th:each="teacher,stat : ${teachers}">

                        <td th:text="${stat.count}"></td>

                        <td>
                            <img th:src="${teacher.photo != null ? '/uploads/teachers/' + teacher.photo : '/images/no-image.png'}"
                                 class="teacher-list-photo rounded shadow-sm"
                                 alt="Teacher Photo">
                        </td>

                        <td th:text="${teacher.employeeCode}"></td>

                        <td th:text="${teacher.tenNo != null ? teacher.tenNo : '—'}"></td>

                        <td th:text="${teacher.teacherName}"></td>

                        <td th:text="${teacher.mobile}"></td>

                        <td th:text="${teacher.subject != null ? teacher.subject.subjectName : '--'}"></td>

                        <td th:text="${teacher.joiningDate}"></td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${teacher.active}">

                                Active

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${teacher.active}">

                                Inactive

                            </span>

                        </td>

                        <td>
                            <div class="teacher-action-buttons">
                            <a th:href="@{'/teacher-sessions/history/' + ${teacher.id}}"
                               class="btn btn-outline-dark btn-sm"
                               title="History">

                                <i class="bi bi-clock-history"></i>

                            </a>

                            <a th:href="@{'/teachers/edit/' + ${teacher.id}}"
                               class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil"></i>

                            </a>

                            <form th:action="@{/teachers/delete/{id}(id=${teacher.id})}" method="post" class="d-inline teacher-action-form"
                                   onclick="return confirm('Delete this teacher?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                        <i class="bi bi-trash"></i>

                                    </button>
                                </form>
                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(teachers)}">

                        <td colspan="10"
                            class="text-center py-5">

                            <i class="bi bi-person-x display-4"></i>

                            <br><br>

                            No Teacher Found

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>



</body>

</html>
