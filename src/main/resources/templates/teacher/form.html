<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">
    <div class="container-fluid">

        <div class="sms-page-header mb-4">
            <div>
                <h2 class="sms-page-title" th:text="${teacher.id == null ? 'Add Teacher' : 'Edit Teacher'}">Add Teacher</h2>
                <p class="text-secondary mb-0">Create and manage teacher information.</p>
            </div>
            <a th:href="@{/teachers}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Back
            </a>
        </div>

        <form th:action="@{/teachers/save}"
              th:object="${teacher}"
              method="post"
              enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <input type="hidden" th:field="*{id}">

            <!-- Personal Information -->
            <div class="sms-card mb-4">
                <div class="p-3">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-person-vcard fs-5 me-2"></i>
                        <h5 class="form-section-title mb-0">Personal Information</h5>
                    </div>

                    <div class="row g-4 align-items-start">
                        <div class="col-lg-3 col-md-4 text-center">
                            <div class="teacher-photo-panel p-3">
                                <img id="teacherPhotoPreview"
                                     th:src="${teacher.photo != null ? '/uploads/teachers/' + teacher.photo : '/images/no-image.png'}"
                                     alt="Teacher Photo"
                                     class="img-thumbnail shadow-sm"
                                     style="width:180px;height:220px;object-fit:cover;">
                                <div class="mt-3 text-start">
                                    <label for="teacherPhotoFile" class="form-label fw-semibold">Teacher Photo</label>
                                    <input type="file"
                                           id="teacherPhotoFile"
                                           name="photoFile"
                                           class="form-control"
                                           accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
                                    <small class="text-secondary d-block mt-2">JPG, JPEG, PNG or WEBP · Max 5 MB</small>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-9 col-md-8">
                            <div class="row g-4">
                                <div class="col-md-6" th:if="${teacher.id != null}">
                                    <label class="form-label">Employee Code</label>
                                    <input type="text" class="form-control" th:value="${teacher.employeeCode}" readonly>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">TEN Number</label>
                                    <input type="text" class="form-control text-uppercase" th:field="*{tenNo}"
                                           maxlength="30" placeholder="Enter TEN Number" autocomplete="off">
                                    <small class="text-danger" th:errors="*{tenNo}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Teacher Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control name-input" th:field="*{teacherName}"
                                           placeholder="Enter Teacher Name">
                                    <small class="text-danger" th:errors="*{teacherName}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" th:field="*{gender}">
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" th:field="*{dateOfBirth}">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Father / Husband Name</label>
                                    <input type="text" class="form-control" th:field="*{fatherName}"
                                           placeholder="Enter Father / Husband Name">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="sms-card mb-4">
                <div class="p-3">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-telephone fs-5 me-2"></i>
                        <h5 class="form-section-title mb-0">Contact Information</h5>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" class="form-control mobile-input" th:field="*{mobile}"
                                   placeholder="9876543210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control email-input" th:field="*{email}"
                                   placeholder="teacher@gmail.com">
                            <small class="text-danger" th:errors="*{email}"></small>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="3" th:field="*{address}"
                                      placeholder="Enter Complete Address"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Professional Information -->
            <div class="sms-card mb-4">
                <div class="p-3">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-mortarboard fs-5 me-2"></i>
                        <h5 class="form-section-title mb-0">Professional Information</h5>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Qualification</label>
                            <input type="text" class="form-control" th:field="*{qualification}"
                                   placeholder="B.Ed, M.Sc">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Specialization</label>
                            <input type="text" class="form-control" th:field="*{specialization}"
                                   placeholder="Enter Specialization">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Subject <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{subjectId}">
                                <option value="">-- Select Subject --</option>
                                <option th:each="sub : ${subjects}"
                                        th:value="${sub.id}"
                                        th:text="${sub.subjectName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" min="0" class="form-control" th:field="*{experience}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Employment Information -->
            <div class="sms-card mb-4">
                <div class="p-3">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-briefcase fs-5 me-2"></i>
                        <h5 class="form-section-title mb-0">Employment Information</h5>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Employee ID</label>
                            <input type="text" class="form-control" th:value="${teacher.employeeCode}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Joining Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{joiningDate}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Employment Type</label>
                            <select class="form-select" th:field="*{employmentType}">
                                <option value="">Select Type</option>
                                <option value="Permanent">Permanent</option>
                                <option value="Contract">Contract</option>
                                <option value="Part Time">Part Time</option>
                                <option value="Guest">Guest</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Designation</label>
                            <input type="text" class="form-control" th:field="*{designation}"
                                   placeholder="Teacher / Senior Teacher / HOD">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Salary</label>
                            <input type="number" class="form-control" min="0" step="0.01" th:field="*{salary}"
                                   placeholder="25000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{active}">
                                <option th:value="true">Active</option>
                                <option th:value="false">Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Additional Information -->
            <div class="sms-card mb-4">
                <div class="p-3">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-journal-text fs-5 me-2"></i>
                        <h5 class="form-section-title mb-0">Additional Information</h5>
                    </div>
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Remarks</label>
                            <textarea class="form-control" rows="4" th:field="*{remarks}"
                                      placeholder="Enter any additional remarks"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mb-4">
                <a th:href="@{/teachers}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${teacher.id == null ? 'Save Teacher' : 'Update Teacher'}">Save Teacher</span>
                </button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

<script>
    const teacherPhotoFile = document.getElementById('teacherPhotoFile');
    const teacherPhotoPreview = document.getElementById('teacherPhotoPreview');
    if (teacherPhotoFile && teacherPhotoPreview) {
        teacherPhotoFile.addEventListener('change', function () {
            const file = this.files && this.files[0];
            if (!file) return;
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                this.value = '';
                alert('Please select a JPG, JPEG, PNG or WEBP image.');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                this.value = '';
                alert('Teacher photo must be 5 MB or smaller.');
                return;
            }
            teacherPhotoPreview.src = URL.createObjectURL(file);
        });
    }
</script>

</body>
</html>
