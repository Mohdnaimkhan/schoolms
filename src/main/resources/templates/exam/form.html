<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title"
                    th:text="${exam.id == null ? 'Add Exam' : 'Edit Exam'}">
                </h2>

                <p class="text-secondary mb-0">

                    Define an Exam for a Class in an Academic Session

                </p>

            </div>

            <a th:href="@{/exams}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <form th:action="@{/exams/save}" th:object="${exam}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Exam Name
                                <span class="text-danger">*</span>

                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{examName}"
                                   placeholder="e.g. First Term Exam"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Exam Date

                            </label>

                            <input type="date" class="form-control" th:field="*{examDate}">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Academic Session
                                <span class="text-danger">*</span>

                            </label>

                            <select class="form-select" th:field="*{academicSessionId}" required>

                                <option value="">-- Select Academic Session --</option>

                                <option th:each="as : ${academicSessions}"
                                        th:value="${as.id}"
                                        th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Class
                                <span class="text-danger">*</span>

                            </label>

                            <select class="form-select" th:field="*{classRoomId}" required>

                                <option value="">-- Select Class --</option>

                                <option th:each="c : ${classRooms}"
                                        th:value="${c.id}"
                                        th:text="${c.className}">
                                </option>

                            </select>

                        </div>

                        <div class="col-12">

                            <label class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{description}"
                                      placeholder="Optional notes about this exam">
                            </textarea>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/exams}" class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-check-circle me-2"></i>

                            <span th:text="${exam.id == null ? 'Save' : 'Update'}"></span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
