<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title" th:text="${exam.examName}"></h2>

                <p class="text-secondary mb-0">

                    <span th:text="${exam.academicSession != null ? exam.academicSession.sessionName : '--'}"></span>
                    -
                    <span th:text="${exam.classRoom != null ? exam.classRoom.className : '--'}"></span>

                </p>

            </div>

            <a th:href="@{/exams}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="row g-4">

            <!-- Subjects -->

            <div class="col-lg-7">

                <div class="sms-card">

                    <div class="p-3">

                        <h5 class="fw-bold mb-3">

                            <i class="bi bi-journal-bookmark me-2"></i>

                            Subjects

                        </h5>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">

                                <thead>

                                <tr>

                                    <th>Subject</th>
                                    <th>Max Marks</th>
                                    <th>Pass Marks</th>
                                    <th width="180" class="text-center">Action</th>

                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="es : ${examSubjects}">

                                    <td th:text="${es.subject != null ? es.subject.subjectName : '--'}"></td>

                                    <td th:text="${es.maxMarks}"></td>

                                    <td th:text="${es.passMarks}"></td>

                                    <td class="text-center">

                                        <a th:href="@{'/results/entry/' + ${es.id}}"
                                           class="btn btn-primary btn-sm"
                                           title="Enter Marks">

                                            <i class="bi bi-pencil-square"></i>
                                            Marks

                                        </a>

                                        <form th:action="@{/exams/{examId}/subjects/delete/{examSubjectId}(examId=${exam.id},examSubjectId=${es.id})}" method="post" class="d-inline"
                                           onclick="return confirm('Remove this subject from the exam? Any marks entered for it will also be removed.')">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-danger btn-sm" title="Remove Subject">

                                                <i class="bi bi-trash"></i>

                                            </button>
                                        </form>

                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(examSubjects)}">

                                    <td colspan="4" class="text-center py-4">

                                        No Subjects Added Yet

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                        <hr>

                        <h6 class="fw-bold">Add Subject</h6>

                        <form th:action="@{'/exams/' + ${exam.id} + '/subjects/add'}"
                              method="post"
                              class="row g-2 align-items-end">

                            <div class="col-md-5">

                                <label class="form-label">Subject</label>

                                <select name="subjectId" class="form-select" required>

                                    <option value="">-- Select Subject --</option>

                                    <option th:each="s : ${subjects}"
                                            th:value="${s.id}"
                                            th:text="${s.subjectName}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">Max Marks</label>

                                <input type="number" name="maxMarks" class="form-control" value="100">

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">Pass Marks</label>

                                <input type="number" name="passMarks" class="form-control" value="33">

                            </div>

                            <div class="col-md-1">

                                <button type="submit" class="btn btn-success w-100">

                                    <i class="bi bi-plus-lg"></i>

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

            <!-- Students / Report Cards -->

            <div class="col-lg-5">

                <div class="sms-card">

                    <div class="p-3">

                        <h5 class="fw-bold mb-3">

                            <i class="bi bi-people me-2"></i>

                            Students - Report Cards

                        </h5>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">

                                <thead>

                                <tr>

                                    <th>Student</th>
                                    <th width="120" class="text-center">Report Card</th>

                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="st : ${students}">

                                    <td th:text="${st.student != null ? st.student.studentName : '--'}"></td>

                                    <td class="text-center">

                                        <a th:href="@{'/results/report-card/' + ${st.id} + '/' + ${exam.id}}"
                                           class="btn btn-outline-dark btn-sm">

                                            <i class="bi bi-file-earmark-text"></i>

                                        </a>

                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(students)}">

                                    <td colspan="2" class="text-center py-4">

                                        No Students Found for this Class / Session

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
