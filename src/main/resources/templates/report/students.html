<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-people me-2"></i>

                    Student Report

                </h2>

            </div>

            <a th:href="@{/reports}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card mb-3">

            <div class="p-3">

                <form th:action="@{/reports/students}" method="get" class="row g-2 align-items-end">

                    <div class="col-auto">

                        <label class="form-label fw-semibold mb-0">Academic Session</label>

                        <select name="sessionId" class="form-select">

                            <option value="">-- Select --</option>

                            <option th:each="as : ${academicSessions}"
                                    th:value="${as.id}"
                                    th:selected="${selectedSessionId != null && selectedSessionId == as.id}"
                                    th:text="${as.sessionName}">
                            </option>

                        </select>

                    </div>

                    <div class="col-auto">

                        <label class="form-label fw-semibold mb-0">Class</label>

                        <select name="classRoomId" class="form-select">

                            <option value="">All Classes</option>

                            <option th:each="c : ${classRooms}"
                                    th:value="${c.id}"
                                    th:selected="${selectedClassRoomId != null && selectedClassRoomId == c.id}"
                                    th:text="${c.className}">
                            </option>

                        </select>

                    </div>

                    <div class="col-auto">

                        <label class="form-label fw-semibold mb-0">Section</label>

                        <select name="sectionId" class="form-select">

                            <option value="">All Sections</option>

                            <option th:each="sec : ${sections}"
                                    th:value="${sec.id}"
                                    th:selected="${selectedSectionId != null && selectedSectionId == sec.id}"
                                    th:text="${sec.sectionName}">
                            </option>

                        </select>

                    </div>

                    <div class="col-auto">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-search me-2"></i>

                            Generate

                        </button>

                    </div>

                </form>

            </div>

        </div>

        <div th:if="${sessions != null}">

            <div class="row g-3 mb-3">

                <div class="col-md-3">

                    <div class="sms-card p-3 text-center">

                        <div class="text-secondary">Total</div>
                        <div class="fs-3 fw-bold" th:text="${totalCount}"></div>

                    </div>

                </div>

                <div class="col-md-3" th:each="entry : ${statusCounts}">

                    <div class="sms-card p-3 text-center">

                        <div class="text-secondary" th:text="${entry.key}"></div>
                        <div class="fs-3 fw-bold" th:text="${entry.value}"></div>

                    </div>

                </div>

            </div>

            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                        <tr>

                            <th>#</th>
                            <th>Student</th>
                            <th>Admission No</th>
                            <th>Class</th>
                            <th>Section</th>
                            <th>Roll No</th>
                            <th>Status</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="s, stat : ${sessions}">

                            <td th:text="${stat.count}"></td>

                            <td th:text="${s.student != null ? s.student.studentName : '--'}"></td>

                            <td th:text="${s.student != null ? s.student.admissionNo : '--'}"></td>

                            <td th:text="${s.classRoom != null ? s.classRoom.className : '--'}"></td>

                            <td th:text="${s.section != null ? s.section.sectionName : '--'}"></td>

                            <td th:text="${s.rollNumber ?: '--'}"></td>

                            <td th:text="${s.status}"></td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(sessions)}">

                            <td colspan="7" class="text-center py-5">

                                No Students Found

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
