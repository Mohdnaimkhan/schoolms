<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-currency-rupee me-2"></i>

                    Fee Report

                </h2>

            </div>

            <a th:href="@{/reports}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card mb-3">

            <div class="p-3">

                <form th:action="@{/reports/fees}" method="get" class="row g-2 align-items-end">

                    <div class="col-auto">

                        <label class="form-label fw-semibold mb-0">Academic Session</label>

                        <select name="sessionId" class="form-select">

                            <option value="">-- Select --</option>

                            <option th:each="as : ${academicSessions}"
                                    th:value="${as.id}"
                                    th:selected="${selectedSessionId != null && selectedSessionId == as.id}"
                                    th:text="${as.sessionName}">
                            </option>

                        </select>

                    </div>

                    <div class="col-auto">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-search me-2"></i>

                            Generate

                        </button>

                    </div>

                </form>

            </div>

        </div>

        <div th:if="${fees != null}">

            <div class="row g-3 mb-3">

                <div class="col-md-4">

                    <div class="sms-card p-3 text-center">

                        <div class="text-secondary">Total Amount</div>
                        <div class="fs-3 fw-bold" th:text="${totalAmount}"></div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="sms-card p-3 text-center">

                        <div class="text-secondary">Total Collected</div>
                        <div class="fs-3 fw-bold text-success" th:text="${totalPaid}"></div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="sms-card p-3 text-center">

                        <div class="text-secondary">Total Due</div>
                        <div class="fs-3 fw-bold text-danger" th:text="${totalDue}"></div>

                    </div>

                </div>

            </div>

            <div class="sms-card mb-3">

                <div class="p-3">

                    <h5 class="fw-bold mb-3">Collection by Fee Head</h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead>

                            <tr>

                                <th>Fee Head</th>
                                <th>Collected Amount</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="entry : ${collectionByFeeHead}">

                                <td th:text="${entry.key}"></td>

                                <td th:text="${entry.value}"></td>

                            </tr>

                            <tr th:if="${#maps.isEmpty(collectionByFeeHead)}">

                                <td colspan="2" class="text-center py-4">

                                    No Fee Records Found

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                        <tr>

                            <th>Receipt</th>
                            <th>Student</th>
                            <th>Fee Head</th>
                            <th>Amount</th>
                            <th>Paid</th>
                            <th>Due</th>
                            <th>Status</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="fee : ${fees}">

                            <td th:text="${fee.receiptNo}"></td>

                            <td th:text="${fee.studentSession != null && fee.studentSession.student != null ? fee.studentSession.student.studentName : '--'}"></td>

                            <td th:text="${fee.feeHead != null ? fee.feeHead.name : '--'}"></td>

                            <td th:text="${fee.amount}"></td>

                            <td th:text="${fee.paidAmount}"></td>

                            <td th:text="${fee.dueAmount}"></td>

                            <td th:text="${fee.status}"></td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(fees)}">

                            <td colspan="7" class="text-center py-5">

                                No Fee Records Found

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
