<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Fee Management')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h3 class="mb-1">Fee Management</h3>
                    <p class="text-muted mb-0">
                        Manage Student Fee Records
                    </p>
                </div>

                <a th:href="@{/fees/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>
                    Add Fee
                </a>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-receipt"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Records</span><strong
                                class="module-stat-value" th:text="${feeTotal}">0</strong><small
                                class="module-stat-meta">Fee records</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-check-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Paid</span><strong
                                class="module-stat-value" th:text="${feePaid}">0</strong><small
                                class="module-stat-meta">Paid records</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-warning"><i class="bi bi-hourglass-split"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Partial</span><strong
                                class="module-stat-value" th:text="${feePartial}">0</strong><small
                                class="module-stat-meta">Partially paid</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-danger"><i class="bi bi-exclamation-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Pending</span><strong
                                class="module-stat-value" th:text="${feePending}">0</strong><small
                                class="module-stat-meta">Pending records</small></div>
                    </div>
                </div>
            </div>
            <!-- Session Filter -->

            <div class="card mb-3">

                <div class="card-body py-3">

                    <form th:action="@{/fees}" method="get" class="row g-2 align-items-center">

                        <label class="col-auto form-label fw-semibold mb-0">

                            <i class="bi bi-calendar-event me-1"></i>

                            Academic Session

                        </label>

                        <div class="col-auto">

                            <select name="sessionId" class="form-select" onchange="this.form.submit()">

                                <option value="">All Sessions</option>

                                <option th:each="as : ${academicSessions}" th:value="${as.id}"
                                    th:selected="${selectedSessionId != null && selectedSessionId == as.id}"
                                    th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-auto" th:if="${selectedSessionId != null}">

                            <a th:href="@{/fees}" class="btn btn-outline-secondary btn-sm">

                                <i class="bi bi-x-circle me-1"></i>

                                Clear Filter

                            </a>

                        </div>

                    </form>

                </div>

            </div>

            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="card">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle" data-module-search-table>

                            <thead>

                                <tr>

                                    <th>Receipt</th>
                                    <th>Student</th>
                                    <th>Class</th>
                                    <th>Fee Head</th>
                                    <th>Total</th>
                                    <th>Paid</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th width="120">Action</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="fee : ${feeList}">

                                    <td th:text="${fee.receiptNo}"></td>

                                    <td
                                        th:text="${fee.studentSession != null && fee.studentSession.student != null ? fee.studentSession.student.studentName : '--'}">
                                    </td>

                                    <td
                                        th:text="${fee.studentSession != null && fee.studentSession.classRoom != null ? fee.studentSession.classRoom.className : '--'}">
                                    </td>

                                    <td th:text="${fee.feeHead != null ? fee.feeHead.name : '--'}"></td>

                                    <td th:text="${fee.amount}"></td>

                                    <td th:text="${fee.paidAmount}"></td>

                                    <td th:text="${fee.status}"></td>

                                    <td th:text="${fee.paymentDate}"></td>

                                    <td>

                                        <a class="btn btn-sm btn-warning" th:href="@{/fees/edit/{id}(id=${fee.id})}">

                                            <i class="bi bi-pencil"></i>

                                        </a>

                                        <form th:action="@{/fees/delete/{id}(id=${fee.id})}" method="post"
                                            class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                                <i class="bi bi-trash"></i>

                                            </button>
                                        </form>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
