<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Fee Form')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <!-- Page Header -->

        <div class="sms-page-header">

            <div>

                <h2 class="sms-page-title">

                    Fee Collection

                </h2>

                <div class="sms-breadcrumb">

                    Dashboard / Fees / Form

                </div>

            </div>

        </div>

        <!-- Card -->

        <div class="card shadow-sm border-0">

            <div class="card-header">

                <h5 class="mb-0">

                    Fee Details

                </h5>

            </div>

            <div class="card-body">

                <!-- YAHAN POORA FORM AAYEGA -->

                <form th:action="@{/fees/save}" th:object="${fee}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Receipt No
                                </label>

                                <input type="text" class="form-control" th:field="*{receiptNo}" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Payment Date
                                </label>

                                <input type="date" class="form-control" th:field="*{paymentDate}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Student
                                </label>

                                <select class="form-select" th:field="*{studentSessionId}" required>

                                    <option value="">
                                        Select Student
                                    </option>

                                    <option th:each="ss : ${studentSessions}" th:value="${ss.id}"
                                        th:text="${(ss.student != null ? ss.student.studentName : '--')
                                            + ' - ' + (ss.classRoom != null ? ss.classRoom.className : '--')
                                            + ' (' + (ss.academicSession != null ? ss.academicSession.sessionName : '--') + ')'}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Fee Head
                                </label>

                                <select class="form-select" th:field="*{feeHeadId}" required>

                                    <option value="">
                                        Select Fee Head
                                    </option>

                                    <option th:each="fh : ${feeHeads}" th:value="${fh.id}"
                                        th:text="${fh.name}">
                                    </option>

                                </select>

                            </div>

                        <div class="text-end">

                            <a th:href="@{/fees}" class="btn btn-secondary">

                                Back

                            </a>

                            <button type="reset" class="btn btn-warning">

                                Reset

                            </button>

                            <button type="submit" class="btn btn-primary">

                                Save

                            </button>

                        </div>

                </form>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
