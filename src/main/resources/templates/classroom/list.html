<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <!-- Page Header -->

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-building me-2"></i>

                    Classes

                </h2>

                <p class="text-secondary mb-0">

                    Manage School Classes

                </p>

            </div>

            <a th:href="@{/classrooms/add}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle me-2"></i>

                Add Class

            </a>

        </div>

        <!-- Card -->

        <div class="sms-card">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>

                    <tr>

                        <th>#</th>

                        <th>Class</th>

                        <th>Display Order</th>

                        <th>Description</th>

                        <th>Status</th>

                        <th width="170" class="text-center">

                            Action

                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="c, stat : ${classRooms}">

                        <td th:text="${stat.count}"></td>

                        <td th:text="${c.className ?: '--'}"></td>

                        <td th:text="${c.displayOrder ?: '--'}"></td>

                        <td th:text="${c.description ?: '--'}"></td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${c.active}">

                                Active

                            </span>

                            <span class="badge bg-secondary"
                                  th:unless="${c.active}">

                                Inactive

                            </span>

                        </td>

                        <td class="text-center">

                            <a th:href="@{'/classrooms/edit/' + ${c.id}}"
                               class="btn btn-warning btn-sm"
                               title="Edit">

                                <i class="bi bi-pencil"></i>

                            </a>

                            <a th:href="@{'/classrooms/status/' + ${c.id}}"
                               class="btn btn-sm"
                               th:classappend="${c.active} ? ' btn-danger' : ' btn-success'"
                               th:title="${c.active} ? 'Deactivate' : 'Activate'"
                               onclick="return confirm('Are you sure?')">

                                <i class="bi"
                                   th:classappend="${c.active} ? ' bi-x-circle' : ' bi-check-circle'"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(classRooms)}">

                        <td colspan="6"
                            class="text-center py-5">

                            <i class="bi bi-building display-5"></i>

                            <br><br>

                            No Class Found

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
