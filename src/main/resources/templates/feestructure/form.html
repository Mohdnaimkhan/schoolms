<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title"
                    th:text="${feeStructure.id == null ? 'Add Fee Structure' : 'Edit Fee Structure'}">
                </h2>

                <p class="text-secondary mb-0">

                    Define the Amount Due for a Fee Head, Per Class, Per Session

                </p>

            </div>

            <a th:href="@{/fee-structures}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <form th:action="@{/fee-structures/save}" th:object="${feeStructure}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Academic Session
                                <span class="text-danger">*</span>

                            </label>

                            <select class="form-select" th:field="*{academicSessionId}" required>

                                <option value="">-- Select Academic Session --</option>

                                <option th:each="as : ${academicSessions}"
                                        th:value="${as.id}"
                                        th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Class
                                <span class="text-danger">*</span>

                            </label>

                            <select class="form-select" th:field="*{classRoomId}" required>

                                <option value="">-- Select Class --</option>

                                <option th:each="c : ${classRooms}"
                                        th:value="${c.id}"
                                        th:text="${c.className}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Fee Head
                                <span class="text-danger">*</span>

                            </label>

                            <select class="form-select" th:field="*{feeHeadId}" required>

                                <option value="">-- Select Fee Head --</option>

                                <option th:each="fh : ${feeHeads}"
                                        th:value="${fh.id}"
                                        th:text="${fh.name}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Amount
                                <span class="text-danger">*</span>

                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   class="form-control"
                                   th:field="*{amount}"
                                   required>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/fee-structures}" class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-check-circle me-2"></i>

                            <span th:text="${feeStructure.id == null ? 'Save' : 'Update'}"></span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
