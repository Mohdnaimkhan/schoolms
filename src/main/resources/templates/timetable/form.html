<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title"
                    th:text="${timetable.id == null ? 'Add Timetable Entry' : 'Edit Timetable Entry'}">
                </h2>

                <p class="text-secondary mb-0">

                    Assign a Subject &amp; Teacher to a Period

                </p>

            </div>

            <a th:href="@{/timetable}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <form th:action="@{/timetable/save}" th:object="${timetable}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Academic Session
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" th:field="*{academicSessionId}" required>

                                <option value="">-- Select Session --</option>

                                <option th:each="as : ${academicSessions}"
                                        th:value="${as.id}"
                                        th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Class
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" th:field="*{classRoomId}" required>

                                <option value="">-- Select Class --</option>

                                <option th:each="c : ${classRooms}"
                                        th:value="${c.id}"
                                        th:text="${c.className}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Section
                            </label>

                            <select class="form-select" th:field="*{sectionId}">

                                <option value="">-- No Section --</option>

                                <option th:each="sec : ${sections}"
                                        th:value="${sec.id}"
                                        th:text="${sec.sectionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Day
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" th:field="*{weekDay}" required>

                                <option value="">-- Select Day --</option>

                                <option th:each="d : ${weekDays}"
                                        th:value="${d}"
                                        th:text="${d}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Period Number
                                <span class="text-danger">*</span>
                            </label>

                            <input type="number"
                                   min="1"
                                   max="12"
                                   class="form-control"
                                   th:field="*{periodNumber}"
                                   required>

                        </div>

                        <div class="col-md-4"></div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                Start Time
                            </label>

                            <input type="time" class="form-control" th:field="*{startTime}">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">
                                End Time
                            </label>

                            <input type="time" class="form-control" th:field="*{endTime}">

                        </div>

                        <div class="col-md-4"></div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Subject
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" th:field="*{subjectId}" required>

                                <option value="">-- Select Subject --</option>

                                <option th:each="s : ${subjects}"
                                        th:value="${s.id}"
                                        th:text="${s.subjectName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Teacher
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" th:field="*{teacherId}" required>

                                <option value="">-- Select Teacher --</option>

                                <option th:each="t : ${teachers}"
                                        th:value="${t.id}"
                                        th:text="${t.teacherName}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/timetable}" class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-check-circle me-2"></i>

                            <span th:text="${timetable.id == null ? 'Save' : 'Update'}"></span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
