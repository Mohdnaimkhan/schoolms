<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-receipt me-2"></i>

                        Expenses

                    </h2>

                    <p class="text-secondary mb-0">

                        Track School Expenditure

                    </p>

                </div>

                <a th:href="@{/expenses/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Expense

                </a>

            </div>

            <div class="sms-card mb-3">

                <div class="p-3">

                    <form th:action="@{/expenses}" method="get" class="row g-2 align-items-end">

                        <div class="col-auto">

                            <label class="form-label fw-semibold mb-0">From Date</label>

                            <input type="date" name="fromDate" class="form-control" th:value="${fromDate}">

                        </div>

                        <div class="col-auto">

                            <label class="form-label fw-semibold mb-0">To Date</label>

                            <input type="date" name="toDate" class="form-control" th:value="${toDate}">

                        </div>

                        <div class="col-auto">

                            <button type="submit" class="btn btn-primary">

                                <i class="bi bi-search me-2"></i>

                                Filter

                            </button>

                        </div>

                        <div class="col-auto" th:if="${fromDate != null}">

                            <a th:href="@{/expenses}" class="btn btn-outline-secondary">

                                Clear

                            </a>

                        </div>

                        <div class="col-auto ms-auto">

                            <div class="text-secondary">Total</div>
                            <div class="fs-4 fw-bold" th:text="${totalAmount}"></div>

                        </div>

                    </form>

                </div>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-wallet2"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Expenses</span><strong
                                class="module-stat-value" th:text="${expenseCount}">0</strong><small
                                class="module-stat-meta">Expense records</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-currency-rupee"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Amount</span><strong
                                class="module-stat-value" th:text="${totalAmount}">0</strong><small
                                class="module-stat-meta">Selected date range</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-info"><i class="bi bi-calendar-month"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">This Month</span><strong
                                class="module-stat-value" th:text="${expenseThisMonthCount}">0</strong><small
                                class="module-stat-meta">Expense entries</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-warning"><i class="bi bi-graph-up-arrow"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Month Amount</span><strong
                                class="module-stat-value" th:text="${expenseThisMonthAmount}">0</strong><small
                                class="module-stat-meta">Current month</small></div>
                    </div>
                </div>
            </div>

            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>
            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0" data-module-search-table>

                        <thead>

                            <tr>

                                <th>#</th>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Paid To</th>
                                <th>Amount</th>
                                <th>Description</th>
                                <th width="120" class="text-center">Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="e, stat : ${expenses}">

                                <td th:text="${stat.count}"></td>

                                <td
                                    th:text="${e.expenseDate != null ? #temporals.format(e.expenseDate,'dd MMM yyyy') : '--'}">
                                </td>

                                <td th:text="${e.category}"></td>

                                <td th:text="${e.paidTo ?: '--'}"></td>

                                <td th:text="${e.amount}"></td>

                                <td th:text="${e.description ?: '--'}"></td>

                                <td class="text-center">

                                    <a th:href="@{'/expenses/edit/' + ${e.id}}" class="btn btn-warning btn-sm"
                                        title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <form th:action="@{/expenses/delete/{id}(id=${e.id})}" method="post"
                                        class="d-inline" onclick="return confirm('Delete this expense?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                            <i class="bi bi-trash"></i>

                                        </button>
                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(expenses)}">

                                <td colspan="7" class="text-center py-5">

                                    <i class="bi bi-inbox display-5"></i>

                                    <br><br>

                                    No Expense Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
