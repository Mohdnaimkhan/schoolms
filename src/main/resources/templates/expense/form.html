<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title"
                    th:text="${expense.id == null ? 'Add Expense' : 'Edit Expense'}">
                </h2>

            </div>

            <a th:href="@{/expenses}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <form th:action="@{/expenses/save}" th:object="${expense}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Category
                                <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{category}"
                                   placeholder="e.g. Electricity, Stationery, Maintenance"
                                   required>

                            <small class="text-danger" th:errors="*{category}"></small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Amount
                                <span class="text-danger">*</span>
                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   class="form-control"
                                   th:field="*{amount}"
                                   required>

                            <small class="text-danger" th:errors="*{amount}"></small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Expense Date
                                <span class="text-danger">*</span>
                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:field="*{expenseDate}"
                                   required>

                            <small class="text-danger" th:errors="*{expenseDate}"></small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Paid To
                            </label>

                            <input type="text"
                                   class="form-control name-input"
                                   th:field="*{paidTo}"
                                   placeholder="Vendor / person name">

                        </div>

                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <input type="text" class="form-control" th:field="*{description}">

                        </div>

                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Remarks
                            </label>

                            <textarea class="form-control" rows="3" th:field="*{remarks}"></textarea>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/expenses}" class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-check-circle me-2"></i>

                            <span th:text="${expense.id == null ? 'Save' : 'Update'}"></span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
