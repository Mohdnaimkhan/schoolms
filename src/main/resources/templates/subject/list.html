<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <!-- Page Header -->

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-book-half me-2"></i>

                        Subjects

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage all school subjects.

                    </p>

                </div>

                <a th:href="@{/subjects/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Subject

                </a>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-book-half"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Subjects</span><strong
                                class="module-stat-value" th:text="${subjectTotal}">0</strong><small
                                class="module-stat-meta">All subjects</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-check-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Active Subjects</span><strong
                                class="module-stat-value" th:text="${subjectActive}">0</strong><small
                                class="module-stat-meta">Currently active</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-warning"><i class="bi bi-pause-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Inactive Subjects</span><strong
                                class="module-stat-value" th:text="${subjectInactive}">0</strong><small
                                class="module-stat-meta">Not active</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-info"><i class="bi bi-upc-scan"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">With Code</span><strong
                                class="module-stat-value" th:text="${subjectWithCode}">0</strong><small
                                class="module-stat-meta">Subject code set</small></div>
                    </div>
                </div>
            </div>

            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" data-module-search-table>

                    <thead>

                        <tr>

                            <th>#</th>
                            <th>Subject</th>
                            <th>Code</th>
                            <th>Class</th>
                            <th>Status</th>
                            <th width="170">Action</th>

                        </tr>

                    </thead>

                    <tbody id="subjectTable">

                        <tr th:each="item,stat : ${subjects}">

                            <td th:text="${stat.count}"></td>

                            <td th:text="${item.subjectName}"></td>

                            <td th:text="${item.subjectCode}"></td>

                            <td th:text="${item.classRoom != null ? item.classRoom.className : '--'}"></td>

                            <td>

                                <span class="badge bg-success" th:if="${item.active}">

                                    Active

                                </span>

                                <span class="badge bg-danger" th:unless="${item.active}">

                                    Inactive

                                </span>

                            </td>

                            <td>

                                <a th:href="@{'/subjects/edit/' + ${item.id}}" class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil"></i>

                                </a>

                                <form th:action="@{/subjects/delete/{id}(id=${item.id})}" method="post" class="d-inline"
                                    onclick="return confirm('Delete this subject?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                        <i class="bi bi-trash"></i>

                                    </button>
                                </form>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(subjects)}">

                            <td colspan="6" class="text-center py-5">

                                <i class="bi bi-inbox display-5"></i>

                                <br><br>

                                No Subject Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>



</body>

</html>
