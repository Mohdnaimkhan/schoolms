<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Attendance')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h3 class="mb-0">Attendance</h3>

                <small class="text-muted">
                    Manage Student Attendance
                </small>

            </div>

            <a th:href="@{/attendance/new}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>

                Mark Attendance

            </a>

        </div>

        <div class="row g-4 module-stat-grid">
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-primary"><i class="bi bi-calendar-check"></i></div><div class="module-stat-body"><span class="module-stat-label">Total Records</span><strong class="module-stat-value" th:text="${attendanceTotal}">0</strong><small class="module-stat-meta">Attendance records</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-success"><i class="bi bi-check-circle-fill"></i></div><div class="module-stat-body"><span class="module-stat-label">Present</span><strong class="module-stat-value" th:text="${attendancePresent}">0</strong><small class="module-stat-meta">Present records</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-danger"><i class="bi bi-x-circle-fill"></i></div><div class="module-stat-body"><span class="module-stat-label">Absent</span><strong class="module-stat-value" th:text="${attendanceAbsent}">0</strong><small class="module-stat-meta">Absent records</small></div></div></div>
<div class="col-xl-3 col-md-6"><div class="module-stat-card"><div class="module-stat-icon bg-warning"><i class="bi bi-dash-circle-fill"></i></div><div class="module-stat-body"><span class="module-stat-label">Leave</span><strong class="module-stat-value" th:text="${attendanceLeave}">0</strong><small class="module-stat-meta">Leave records</small></div></div></div>
</div>
<!-- Session Filter -->

        <div class="card mb-3">

            <div class="card-body py-3">

                <form th:action="@{/attendance}" method="get" class="row g-2 align-items-center">

                    <label class="col-auto form-label fw-semibold mb-0">

                        <i class="bi bi-calendar-event me-1"></i>

                        Academic Session

                    </label>

                    <div class="col-auto">

                        <select name="sessionId" class="form-select" onchange="this.form.submit()">

                            <option value="">All Sessions</option>

                            <option th:each="as : ${academicSessions}"
                                    th:value="${as.id}"
                                    th:selected="${selectedSessionId != null && selectedSessionId == as.id}"
                                    th:text="${as.sessionName}">
                            </option>

                        </select>

                    </div>

                    <div class="col-auto" th:if="${selectedSessionId != null}">

                        <a th:href="@{/attendance}" class="btn btn-outline-secondary btn-sm">

                            <i class="bi bi-x-circle me-1"></i>

                            Clear Filter

                        </a>

                    </div>

                </form>

            </div>

        </div>

        <div class="card">

            <div class="card-body">

                <div class="table-responsive">

                    
                <!-- Module Search -->
                <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>
    <div class="card-header"><i class="bi bi-funnel-fill me-2"></i>Search &amp; Filters</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-lg-7 col-md-8">
          <label class="form-label fw-semibold">Search attendance</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control module-search-input" placeholder="Type to search..." autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn-outline-secondary module-search-clear" title="Clear search"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
        <div class="col-lg-3 col-md-4"><div class="small text-secondary module-search-count"></div></div>
        <div class="col-lg-2"><button type="button" class="btn btn-primary w-100 module-search-focus"><i class="bi bi-search me-1"></i>Search</button></div>
      </div>
    </div>
  </div>

  <table class="table table-hover align-middle" data-module-search-table>

                        <thead>

                        <tr>

                            <th>#</th>
                            <th>Date</th>
                            <th>Student</th>
                            <th>Admission No</th>
                            <th>Class</th>
                            <th>Session</th>
                            <th>Status</th>
                            <th>Remarks</th>
                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="attendance,stat : ${attendanceList}">

                            <td th:text="${stat.count}"></td>

                            <td th:text="${attendance.attendanceDate}"></td>

                            <td th:text="${attendance.student.studentName}"></td>

                            <td th:text="${attendance.student.admissionNo}"></td>

                            <td th:text="${attendance.classroom.className}"></td>

                            <td th:text="${attendance.academicSession.sessionName}"></td>

                            <td>

                                <span class="badge bg-success"
                                      th:if="${attendance.status.name()=='PRESENT'}">

                                    Present

                                </span>

                                <span class="badge bg-danger"
                                      th:if="${attendance.status.name()=='ABSENT'}">

                                    Absent

                                </span>

                                <span class="badge bg-warning text-dark"
                                      th:if="${attendance.status.name()=='LEAVE'}">

                                    Leave

                                </span>

                            </td>

                            <td th:text="${attendance.remarks}"></td>

                            <td>

                                <form th:action="@{/attendance/delete/{id}(id=${attendance.id})}" method="post" class="d-inline"
                                   onclick="return confirm('Delete Attendance ?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                        <i class="bi bi-trash"></i>

                                    </button>
                                </form>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
