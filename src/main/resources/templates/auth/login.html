<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Login')}"></head>

<body>

<div class="d-flex align-items-center justify-content-center"
     style="min-height: 100vh; background: var(--bg-body);">

    <div class="card shadow-sm border-0" style="width: 100%; max-width: 400px;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <img src="/images/logo.png" alt="Logo" style="height: 56px;">

                <h4 class="fw-bold mt-3 mb-0" th:text="${schoolInfo.schoolName != null && !#strings.isEmpty(schoolInfo.schoolName) ? schoolInfo.schoolName : 'School Management System'}">School Management System</h4>

                <p class="school-slogan mb-1" th:if="${schoolInfo.slogan != null && !#strings.isEmpty(schoolInfo.slogan)}" th:text="${schoolInfo.slogan}"></p>

                <p class="text-secondary">Sign in to continue</p>

            </div>

            <div class="alert alert-danger py-2" th:if="${param.error != null}">

                Invalid username or password.

            </div>

            <div class="alert alert-success py-2" th:if="${param.logout != null}">

                You have been logged out.

            </div>

            <div class="alert alert-success py-2" th:if="${param.setup != null}">

                Administrator account created. You can now sign in.

            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">

                    <label class="form-label fw-semibold">Username</label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter username"
                           autofocus
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-semibold">Password</label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter password"
                           required>

                </div>

                <button type="submit" class="btn btn-primary w-100">

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Sign In

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
