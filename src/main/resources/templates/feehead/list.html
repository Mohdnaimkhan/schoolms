<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-tags me-2"></i>

                        Fee Heads

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage Fee Categories (e.g. Tuition Fee, Transport Fee)

                    </p>

                </div>

                <a th:href="@{/fee-heads/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Fee Head

                </a>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-tags"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Fee Heads</span><strong
                                class="module-stat-value" th:text="${feeHeadTotal}">0</strong><small
                                class="module-stat-meta">All fee heads</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-check-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Active</span><strong
                                class="module-stat-value" th:text="${feeHeadActive}">0</strong><small
                                class="module-stat-meta">Active fee heads</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-warning"><i class="bi bi-pause-circle-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Inactive</span><strong
                                class="module-stat-value" th:text="${feeHeadInactive}">0</strong><small
                                class="module-stat-meta">Inactive fee heads</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-info"><i class="bi bi-card-text"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Described</span><strong
                                class="module-stat-value" th:text="${feeHeadConfigured}">0</strong><small
                                class="module-stat-meta">With description</small></div>
                    </div>
                </div>
            </div>

            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                                <button type="button" class="btn btn-outline-secondary module-search-clear"
                                    title="Clear search" aria-label="Clear search">
                                    <i class="bi bi-x-lg"></i>
                                </button>

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>
            
            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0" data-module-search-table>

                        <thead>

                            <tr>

                                <th>#</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th width="170" class="text-center">Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="f, stat : ${feeHeads}">

                                <td th:text="${stat.count}"></td>

                                <td th:text="${f.name}"></td>

                                <td th:text="${f.description ?: '--'}"></td>

                                <td>

                                    <span class="badge bg-success" th:if="${f.active}">Active</span>

                                    <span class="badge bg-secondary" th:unless="${f.active}">Inactive</span>

                                </td>

                                <td class="text-center">

                                    <a th:href="@{'/fee-heads/edit/' + ${f.id}}" class="btn btn-warning btn-sm"
                                        title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <a th:href="@{'/fee-heads/status/' + ${f.id}}" class="btn btn-sm"
                                        th:classappend="${f.active} ? ' btn-danger' : ' btn-success'"
                                        th:title="${f.active} ? 'Deactivate' : 'Activate'"
                                        onclick="return confirm('Are you sure?')">

                                        <i class="bi"
                                            th:classappend="${f.active} ? ' bi-x-circle' : ' bi-check-circle'"></i>

                                    </a>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(feeHeads)}">

                                <td colspan="5" class="text-center py-5">

                                    <i class="bi bi-tags display-5"></i>

                                    <br><br>

                                    No Fee Head Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
