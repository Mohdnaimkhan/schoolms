<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <!-- Page Header -->

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-lock-fill me-2"></i>

                    Close Academic Session

                </h2>

                <p class="text-secondary mb-0">

                    This action will permanently close the current academic session.

                </p>

            </div>

            <a th:href="@{/academic-sessions}"
               class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <!-- Card -->

        <div class="sms-card">

            <div class="p-3">

                <!-- Warning -->

                <div class="alert alert-warning mb-4">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    <strong>Warning!</strong>

                    Once this session is closed, it cannot be reopened.
                    Please enter the correct End Date before continuing.

                </div>

                <form th:action="@{/academic-sessions/close}"
                      th:object="${academicSession}"
                      method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <input type="hidden"
                           th:field="*{id}">

                    <div class="row g-4">

                        <!-- Session Name -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Session Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="*{sessionName}"
                                   readonly>

                        </div>

                        <!-- Current Status -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Current Status

                            </label>

                            <div>

                                <span class="badge bg-success">

                                    Current Session

                                </span>

                            </div>

                        </div>

                        <!-- Start Date -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                Start Date

                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:value="*{startDate}"
                                   readonly>

                        </div>

                        <!-- End Date -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">

                                End Date

                                <span class="text-danger">*</span>

                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:field="*{endDate}"
                                   th:attr="min=${academicSession.startDate}"
                                   required>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/academic-sessions}"
                           class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('Are you sure you want to close this Academic Session?');">

                            <i class="bi bi-lock-fill me-2"></i>

                            Close Session

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
