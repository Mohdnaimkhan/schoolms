<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <!-- Page Header -->

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-calendar-event me-2"></i>

                        Academic Sessions

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage Academic Sessions

                    </p>

                </div>

                <a th:href="@{/academic-sessions/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Session

                </a>

            </div>

            <!-- Card -->

            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Session</th>

                                <th>Start Date</th>

                                <th>End Date</th>

                                <th>Current</th>

                                <th>Status</th>

                                <th width="240" class="text-center">

                                    Action

                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="s, stat : ${academicSessions}">

                                <td th:text="${stat.count}"></td>

                                <td th:text="${s.sessionName ?: '--'}"></td>

                                <td th:text="${s.startDate ?: '--'}"></td>

                                <td th:text="${s.endDate ?: '--'}"></td>

                                <!-- Current -->

                                <td>

                                    <span class="badge bg-primary" th:if="${s.currentSession}">

                                        Current

                                    </span>

                                </td>

                                <!-- Status -->

                                <td>

                                    <span class="badge bg-success" th:if="${s.endDate == null}">

                                        Running

                                    </span>

                                    <span class="badge bg-secondary" th:unless="${s.endDate == null}">

                                        Closed

                                    </span>

                                </td>

                                <!-- Actions -->

                                <td class="text-center">

                                    <!-- Edit -->

                                    <a th:href="@{'/academic-sessions/edit/' + ${s.id}}" class="btn btn-warning btn-sm"
                                        title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <!-- Set Current -->

                                    <a th:if="${!s.currentSession && s.endDate == null}"
                                        th:href="@{'/academic-sessions/current/' + ${s.id}}"
                                        class="btn btn-success btn-sm" title="Set Current"
                                        onclick="return confirm('Set this as Current Session?')">

                                        <i class="bi bi-check-circle"></i>

                                    </a>

                                    <!-- Close Session -->

                                    <a th:if="${s.currentSession && s.endDate == null}"
                                        th:href="@{'/academic-sessions/close/' + ${s.id}}" class="btn btn-danger btn-sm"
                                        title="Close Session">

                                        <i class="bi bi-lock-fill"></i>

                                    </a>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(academicSessions)}">

                                <td colspan="7" class="text-center py-5">

                                    <i class="bi bi-calendar-x display-5"></i>

                                    <br><br>

                                    No Academic Session Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
