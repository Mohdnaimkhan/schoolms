<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">


            <!-- Page Header -->

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-calendar-event me-2"></i>

                        Academic Sessions

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage Academic Sessions

                    </p>

                </div>

                <a th:href="@{/academic-sessions/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Session

                </a>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-calendar3"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Sessions</span><strong
                                class="module-stat-value" th:text="${sessionTotal}">0</strong><small
                                class="module-stat-meta">All sessions</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-star-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Current</span><strong
                                class="module-stat-value" th:text="${sessionCurrent}">0</strong><small
                                class="module-stat-meta">Current session</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-secondary"><i class="bi bi-lock-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Closed</span><strong
                                class="module-stat-value" th:text="${sessionClosed}">0</strong><small
                                class="module-stat-meta">Closed sessions</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-info"><i class="bi bi-unlock-fill"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Open</span><strong
                                class="module-stat-value" th:text="${sessionOpen}">0</strong><small
                                class="module-stat-meta">Open sessions</small></div>
                    </div>
                </div>
            </div>

            <!-- search module -->
            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>



            <!-- Card -->

            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0" data-module-search-table>

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Session</th>

                                <th>Start Date</th>

                                <th>End Date</th>

                                <th>Current</th>

                                <th>Status</th>

                                <th width="240" class="text-center">

                                    Action

                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="s, stat : ${academicSessions}">

                                <td th:text="${stat.count}"></td>

                                <td th:text="${s.sessionName ?: '--'}"></td>

                                <td th:text="${s.startDate ?: '--'}"></td>

                                <td th:text="${s.endDate ?: '--'}"></td>

                                <!-- Current -->

                                <td>

                                    <span class="badge bg-primary" th:if="${s.currentSession}">

                                        Current

                                    </span>

                                </td>

                                <!-- Status -->

                                <td>

                                    <span class="badge bg-success" th:if="${s.endDate == null}">

                                        Running

                                    </span>

                                    <span class="badge bg-secondary" th:unless="${s.endDate == null}">

                                        Closed

                                    </span>

                                </td>

                                <!-- Actions -->

                                <td class="text-center">

                                    <!-- Edit -->

                                    <a th:href="@{'/academic-sessions/edit/' + ${s.id}}" class="btn btn-warning btn-sm"
                                        title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <!-- Set Current -->

                                    <a th:if="${!s.currentSession && s.endDate == null}"
                                        th:href="@{'/academic-sessions/current/' + ${s.id}}"
                                        class="btn btn-success btn-sm" title="Set Current"
                                        onclick="return confirm('Set this as Current Session?')">

                                        <i class="bi bi-check-circle"></i>

                                    </a>

                                    <!-- Close Session -->

                                    <a th:if="${s.currentSession && s.endDate == null}"
                                        th:href="@{'/academic-sessions/close/' + ${s.id}}" class="btn btn-danger btn-sm"
                                        title="Close Session">

                                        <i class="bi bi-lock-fill"></i>

                                    </a>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(academicSessions)}">

                                <td colspan="7" class="text-center py-5">

                                    <i class="bi bi-calendar-x display-5"></i>

                                    <br><br>

                                    No Academic Session Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
