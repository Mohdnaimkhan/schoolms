<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-people me-2"></i>

                        User Accounts

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage Login Accounts for Admin, Staff &amp; Teacher

                    </p>

                </div>

                <a th:href="@{/users/add}" class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add User

                </a>

            </div>

            <div class="row g-4 module-stat-grid">
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-primary"><i class="bi bi-people"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Total Users</span><strong
                                class="module-stat-value" th:text="${userTotal}">0</strong><small
                                class="module-stat-meta">All accounts</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-person-check"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Active</span><strong
                                class="module-stat-value" th:text="${userActive}">0</strong><small
                                class="module-stat-meta">Active accounts</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-warning"><i class="bi bi-shield-lock"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Admins</span><strong
                                class="module-stat-value" th:text="${userAdmins}">0</strong><small
                                class="module-stat-meta">Administrator accounts</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-info"><i class="bi bi-person-badge"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Staff</span><strong
                                class="module-stat-value" th:text="${userStaff}">0</strong><small
                                class="module-stat-meta">Staff accounts</small></div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="module-stat-card">
                        <div class="module-stat-icon bg-success"><i class="bi bi-person-video3"></i></div>
                        <div class="module-stat-body"><span class="module-stat-label">Teachers</span><strong
                                class="module-stat-value" th:text="${userTeachers}">0</strong><small
                                class="module-stat-meta">Teacher accounts</small></div>
                    </div>
                </div>
            </div>
            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>
            <div class="sms-card">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0" data-module-search-table>

                        <thead>

                            <tr>

                                <th>#</th>
                                <th>Username</th>
                                <th>Full Name</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th width="150" class="text-center">Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="u, stat : ${users}">

                                <td th:text="${stat.count}"></td>

                                <td th:text="${u.username}"></td>

                                <td th:text="${u.fullName ?: '--'}"></td>

                                <td>

                                    <span class="badge"
                                        th:classappend="${u.role.name() == 'ADMIN'} ? ' bg-primary' : (${u.role.name() == 'TEACHER'} ? ' bg-success' : ' bg-secondary')"
                                        th:text="${u.role}">
                                    </span>

                                </td>

                                <td>

                                    <span class="badge bg-success" th:if="${u.active}">Active</span>

                                    <span class="badge bg-danger" th:unless="${u.active}">Inactive</span>

                                </td>

                                <td class="text-center">

                                    <a th:href="@{'/users/edit/' + ${u.id}}" class="btn btn-warning btn-sm"
                                        title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" class="d-inline"
                                        onclick="return confirm('Delete this user account?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Delete">

                                            <i class="bi bi-trash"></i>

                                        </button>
                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(users)}">

                                <td colspan="6" class="text-center py-5">

                                    <i class="bi bi-inbox display-5"></i>

                                    <br><br>

                                    No Users Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
