<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Students')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="sms-content">

        <div class="container-fluid">

            <!-- ===========================
                PAGE HEADER
        ============================ -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h3 class="fw-bold mb-1">
                        <i class="bi bi-people-fill text-primary"></i>
                        Student Management
                    </h3>

                    <small class="text-secondary">
                        Manage Student Records
                    </small>

                </div>

                <div class="d-flex gap-2">

                    <a th:href="@{/student-sessions/promote}" class="btn btn-outline-primary">

                        <i class="bi bi-arrow-up-right-circle"></i>
                        Promote Students

                    </a>

                    <a th:href="@{/students/add}" class="btn btn-primary">

                        <i class="bi bi-plus-circle"></i>
                        New Admission

                    </a>

                </div>

            </div>

            <!-- ===========================
                DASHBOARD
        ============================ -->

            <div class="row g-4 mb-4">

                <div class="col-xl-3 col-md-6">

                    <div class="card shadow-sm h-100 sms-summary-card">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>

                                    <small class="text-muted">
                                        Total Students
                                    </small>

                                    <h3 class="fw-bold mt-2" th:text="${totalStudents}">
                                        0
                                    </h3>

                                </div>

                                <div>

                                    <i class="bi bi-people-fill
                                          text-primary fs-1"></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-xl-3 col-md-6">

                    <div class="card shadow-sm h-100 sms-summary-card">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>

                                    <small class="text-muted">
                                        Active Students
                                    </small>

                                    <h3 class="fw-bold mt-2" th:text="${activeStudents}">
                                        0
                                    </h3>

                                </div>

                                <div>

                                    <i class="bi bi-person-check-fill
                                          text-success fs-1"></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-xl-3 col-md-6">

                    <div class="card shadow-sm h-100 sms-summary-card">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>

                                    <small class="text-muted">
                                        Boys
                                    </small>

                                    <h3 class="fw-bold mt-2" th:text="${boys}">
                                        0
                                    </h3>

                                </div>

                                <div>

                                    <i class="bi bi-gender-male
                                          text-info fs-1"></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-xl-3 col-md-6">

                    <div class="card shadow-sm h-100 sms-summary-card">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>

                                    <small class="text-muted">
                                        Girls
                                    </small>

                                    <h3 class="fw-bold mt-2" th:text="${girls}">
                                        0
                                    </h3>

                                </div>

                                <div>

                                    <i class="bi bi-gender-female
                                          text-danger fs-1"></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
            <!-- ===========================
                SEARCH & FILTER
        ============================ -->

            <div class="card shadow-sm mb-4">

                <div class="card-header">

                    <i class="bi bi-funnel-fill me-2"></i>

                    Search & Filters

                </div>

                <div class="card-body">

                    <form th:action="@{/students}" method="get">

                        <div class="row g-3 align-items-end">

                            <!-- Search -->

                            <div class="col-lg-5">

                                <label class="form-label fw-semibold">

                                    Search Student

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-search"></i>

                                    </span>

                                    <input type="search" name="keyword" class="form-control"
                                        placeholder="Name, admission no, father, mobile, PEN, APAAR..."
                                        autocomplete="off" spellcheck="false"
                                        th:value="${keyword}">
                                    <button type="button" class="btn btn-outline-secondary"
                                            id="studentSearchClear" title="Clear search">
                                        <i class="bi bi-x-lg"></i>
                                    </button>

                                </div>

                            </div>

                            <!-- Status -->

                            <div class="col-lg-3">

                                <label class="form-label fw-semibold">

                                    Student Status

                                </label>

                                <select name="status" class="form-select">

                                    <option value="">All Status</option>

                                    <option th:each="status : ${studentStatuses}" th:value="${status}"
                                        th:text="${status}" th:selected="${status == selectedStatus}">
                                    </option>

                                </select>

                            </div>

                            <!-- Search Button -->

                            <div class="col-lg-2">

                                <button type="submit" class="btn btn-primary w-100">

                                    <i class="bi bi-search me-1"></i>

                                    Search

                                </button>

                            </div>

                            <!-- Reset -->

                            <div class="col-lg-2">

                                <a th:href="@{/students}" class="btn btn-outline-secondary w-100">

                                    <i class="bi bi-arrow-clockwise me-1"></i>

                                    Reset

                                </a>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

            <!-- ===========================
                STUDENT TABLE
        ============================ -->
            <div class="card shadow-sm">

                <div class="card-header d-flex justify-content-between align-items-center">

                    <span>

                        <i class="bi bi-table"></i>

                        Student List

                    </span>

                    <span class="badge bg-primary" th:text="${#lists.size(students)} + ' Records'">
                        0 Records
                    </span>

                </div>

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover table-striped align-middle mb-0">

                            <thead class="table-light">

                                <tr>

                                    <th width="60">#</th>

                                    <th width="90">Photo</th>

                                    <th>Student</th>

                                    <th>Admission No</th>

                                    <th>Father Name</th>

                                    <th>Mobile</th>

                                    <th>Status</th>

                                    <th class="text-center" width="270">Action</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:if="${#lists.isEmpty(students)}">

                                    <td colspan="8" class="text-center py-5">

                                        <i class="bi bi-database-x fs-1 text-muted"></i>
                                        <br>
                                        No Student Found

                                    </td>

                                </tr>

                                <tr th:each="student,stat : ${students}">

                                    <td th:text="${stat.count}"></td>

                                    <td>

                                        <img th:if="${student.photo!=null}"
                                            th:src="@{'/uploads/students/'+${student.photo}}" class="rounded"
                                            style="width:55px;height:65px;object-fit:cover;">

                                        <img th:if="${student.photo==null}" th:src="@{/images/no-image.png}"
                                            class="rounded" style="width:55px;height:65px;object-fit:cover;">

                                    </td>

                                    <td>

                                        <div class="fw-semibold" th:text="${student.studentName}">
                                        </div>

                                        <small class="" th:text="${student.gender}">
                                        </small>

                                    </td>

                                    <td th:text="${student.admissionNo}"></td>

                                    <td th:text="${student.fatherName}"></td>

                                    <td th:text="${student.formattedMobileNumber ?: '-'}"></td>

                                    <td>

                                        <span class="badge" th:classappend="
            ${student.status == T(com.naim.school.student.StudentStatus).ACTIVE} ? 'bg-success' :
            (${student.status == T(com.naim.school.student.StudentStatus).INACTIVE} ? 'bg-secondary' :
            (${student.status == T(com.naim.school.student.StudentStatus).PASSED_OUT} ? 'bg-primary' :
            (${student.status == T(com.naim.school.student.StudentStatus).TRANSFERRED} ? 'bg-warning text-dark' :
            'bg-danger')))" th:text="${student.status}">

                                        </span>

                                    </td>

                                    <td class="text-center">

                                        <div class="d-flex justify-content-center gap-2">

                                            <!-- View -->
                                            <a th:href="@{/students/view/{id}(id=${student.id})}"
                                                class="btn btn-sm btn-outline-info">

                                                <i class="bi bi-eye"></i>

                                            </a>

                                            <!-- Edit -->
                                            <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                                class="btn btn-sm btn-outline-warning">

                                                <i class="bi bi-pencil-square"></i>

                                            </a>

                                            <!-- Print -->
                                            <a th:href="@{/students/print/{id}(id=${student.id})}" target="_blank"
                                                class="btn btn-sm btn-outline-success">

                                                <i class="bi bi-printer"></i>

                                            </a>

                                            <!-- id-card  -->
                                             <a th:href="@{/students/id-card/{id}(id=${student.id})}" target="_blank"
                                                class="btn btn-sm btn-outline-primary">

                                                <i class="bi bi-credit-card"></i>

                                            </a>

                                            <!-- History -->
                                            <a th:href="@{/student-sessions/history/{id}(id=${student.id})}"
                                                class="btn btn-sm btn-outline-dark"
                                                title="Class / Session History">

                                                <i class="bi bi-clock-history"></i>

                                            </a>

                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>




        </div>







    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>

    <script>

        // Auto Hide Alerts

        setTimeout(function () {

            const alerts = document.querySelectorAll(".alert");

            alerts.forEach(function (alert) {

                bootstrap.Alert.getOrCreateInstance(alert).close();

            });

        }, 3000);

    </script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.querySelector('input[name="keyword"]');
    const clear = document.getElementById("studentSearchClear");
    if (!input || !clear) return;

    const sync = () => {
        clear.classList.toggle("d-none", !input.value.trim());
    };

    input.addEventListener("input", sync);
    clear.addEventListener("click", function () {
        input.value = "";
        input.form.submit();
    });
    sync();
});
</script>

</body>

</html>
