<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>


<body>


    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <div th:replace="~{fragments/sidebar :: sidebar}"></div>



    <main class="sms-content">


        <div class="container-fluid">



            <!-- ======================================================= -->
            <!-- PAGE HEADER -->
            <!-- ======================================================= -->


            <div class="sms-page-header mb-4">


                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-person-vcard-fill me-2"></i>

                        <span th:text="${student.id==null ? 
            'Add Student' : 'Edit Student'}"></span>

                    </h2>


                    <p class="text-secondary mb-0">

                        Student Master Information

                    </p>


                </div>



                <a th:href="@{/students}" class="btn btn-outline-secondary">


                    <i class="bi bi-arrow-left me-2"></i>

                    Back


                </a>



            </div>





            <form th:action="@{/students/save}" th:object="${student}" method="post" enctype="multipart/form-data">


                <input type="hidden" th:field="*{id}">





                <!-- ======================================================= -->
                <!-- ADMISSION INFORMATION -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <h5 class="border-bottom pb-2 mb-4">


                            <i class="bi bi-journal-check me-2"></i>

                            Admission Information


                        </h5>




                        <div class="row">

                            <!-- Admission Number -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Admission Number</label>
                                <input type="text" class="form-control"
                                       th:value="${student.id==null ? 'Auto Generated After Save' : student.admissionNo}"
                                       readonly>
                            </div>

                            <!-- Admission Date -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">
                                    Admission Date <span class="text-danger">*</span>
                                </label>
                                <input type="date" class="form-control" th:field="*{admissionDate}">
                                <div class="text-danger small" th:errors="*{admissionDate}"></div>
                            </div>

                            <!-- Status -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Status</label>
                                <select class="form-select" th:field="*{status}">
                                    <option th:each="s:${studentStatuses}" th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>

                            <!-- PEN Number -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">PEN Number</label>
                                <input type="text"
                                       class="form-control aadhaar-input pen-input"
                                       th:field="*{penNo}"
                                       placeholder="1234 5678 9012"
                                       maxlength="14"
                                       inputmode="numeric"
                                       autocomplete="off">
                                <div class="text-danger small" th:errors="*{penNo}"></div>
                            </div>

                            <!-- APAAR ID -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">APAAR ID</label>
                                <input type="text"
                                       class="form-control aadhaar-input apaar-input"
                                       th:field="*{apaarId}"
                                       placeholder="1234 5678 9012"
                                       maxlength="14"
                                       inputmode="numeric"
                                       autocomplete="off">
                                <div class="text-danger small" th:errors="*{apaarId}"></div>
                            </div>

                        </div>


                    </div>


                </div>








                <!-- ======================================================= -->
                <!-- STUDENT INFORMATION -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <h5 class="border-bottom pb-2 mb-4">


                            <i class="bi bi-person-fill me-2"></i>


                            Student Information


                        </h5>





                        <div class="row">





                            <!-- PHOTO -->


                            <div class="col-lg-3 text-center">



                                <img id="photoPreview" th:src="${student.photo!=null ?
'/uploads/students/'+student.photo :
'/images/no-image.png'}" class="img-thumbnail shadow-sm" style="width:180px;
height:220px;
object-fit:cover;">





                                <div class="mt-3">


                                    <input type="file" id="photoFile" name="photoFile" class="form-control"
                                        accept=".jpg,.jpeg,.png,.webp">


                                </div>



                            </div>







                            <!-- DETAILS -->


                            <div class="col-lg-9">



                                <div class="row">





                                    <!-- Student Name -->


                                    <div class="col-md-6 mb-3">


                                        <label class="form-label fw-semibold">


                                            Student Name

                                            <span class="text-danger">*</span>


                                        </label>



                                        <input type="text" class="form-control name-input" th:field="*{studentName}"
                                            placeholder="Student Name">



                                        <div class="text-danger small" th:errors="*{studentName}">

                                        </div>



                                    </div>







                                    <!-- Gender -->


                                    <div class="col-md-6 mb-3">


                                        <label class="form-label fw-semibold">


                                            Gender

                                            <span class="text-danger">*</span>


                                        </label>




                                        <select class="form-select" th:field="*{gender}">


                                            <option value="">

                                                Select Gender

                                            </option>



                                            <option th:each="g:${genders}" th:value="${g}" th:text="${g}">

                                            </option>


                                        </select>



                                        <div class="text-danger small" th:errors="*{gender}">

                                        </div>



                                    </div>







                                    <!-- DOB -->


                                    <div class="col-md-6 mb-3">


                                        <label class="form-label fw-semibold">


                                            Date Of Birth

                                            <span class="text-danger">*</span>


                                        </label>



                                        <input type="date" class="form-control" th:field="*{dateOfBirth}">



                                        <div class="text-danger small" th:errors="*{dateOfBirth}">

                                        </div>



                                    </div>







                                    <!-- Blood Group -->


                                    <div class="col-md-6 mb-3">


                                        <label class="form-label fw-semibold">


                                            Blood Group


                                        </label>




                                        <select class="form-select" th:field="*{bloodGroup}">



                                            <option value="">

                                                Select Blood Group

                                            </option>



                                            <option th:each="bg:${bloodGroups}" th:value="${bg}" th:text="${bg}">

                                            </option>



                                        </select>



                                    </div>




                                </div>



                            </div>



                        </div>


                    </div>


                </div>







                <!-- ======================================================= -->
                <!-- PARENT INFORMATION -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <h5 class="border-bottom pb-2 mb-4">


                            <i class="bi bi-people-fill me-2"></i>


                            Parent Information


                        </h5>





                        <div class="row">





                            <!-- Father -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Father Name

                                    <span class="text-danger">*</span>


                                </label>




                                <input type="text" class="form-control name-input" th:field="*{fatherName}"
                                    placeholder="Father Name">




                                <div class="text-danger small" th:errors="*{fatherName}">

                                </div>


                            </div>







                            <!-- Mother -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Mother Name


                                </label>




                                <input type="text" class="form-control name-input" th:field="*{motherName}"
                                    placeholder="Mother Name">



                            </div>






                            <!-- Guardian Name -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Guardian Name


                                </label>




                                <input type="text" class="form-control name-input" th:field="*{guardianName}"
                                    placeholder="Guardian Name">



                            </div>







                            <!-- Guardian Relation -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Guardian Relation


                                </label>




                                <input type="text" class="form-control" th:field="*{guardianRelation}"
                                    placeholder="Father / Uncle / Other">



                            </div>





                        </div>


                    </div>


                </div>
                <!-- ======================================================= -->
                <!-- CONTACT INFORMATION -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <h5 class="border-bottom pb-2 mb-4">


                            <i class="bi bi-telephone-fill me-2"></i>


                            Contact Information


                        </h5>



                        <div class="row">





                            <!-- Mobile -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Mobile Number


                                </label>



                                <input type="text" class="form-control mobile-input" th:field="*{mobileNumber}"
                                    placeholder="98765 43210">



                                <div class="text-danger small" th:errors="*{mobileNumber}">

                                </div>



                            </div>







                            <!-- Emergency Contact -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Emergency Contact


                                </label>



                                <input type="text" class="form-control mobile-input" th:field="*{emergencyContact}"
                                    placeholder="98765 43210">



                                <div class="text-danger small" th:errors="*{emergencyContact}">

                                </div>



                            </div>








                            <!-- Email -->


                            <div class="col-md-6 mb-3">


                                <label class="form-label fw-semibold">


                                    Email


                                </label>



                                <input type="email" class="form-control email-input" th:field="*{email}"
                                    placeholder="example@gmail.com">



                                <div class="text-danger small" th:errors="*{email}">

                                </div>



                            </div>







                            <!-- Address -->


                            <div class="col-12 mb-3">


                                <label class="form-label fw-semibold">


                                    Address


                                </label>



                                <textarea class="form-control" rows="3" th:field="*{address}"
                                    placeholder="Complete Address"></textarea>



                            </div>




                        </div>


                    </div>


                </div>








                <!-- ======================================================= -->
                <!-- OTHER INFORMATION -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <h5 class="border-bottom pb-2 mb-4">


                            <i class="bi bi-info-circle-fill me-2"></i>


                            Other Information


                        </h5>





                        <div class="row">






                            <!-- Religion -->


                            <div class="col-md-4 mb-3">


                                <label class="form-label fw-semibold">


                                    Religion


                                </label>



                                <select class="form-select" th:field="*{religion}">


                                    <option value="">

                                        Select Religion

                                    </option>



                                    <option th:each="r:${religions}" th:value="${r}" th:text="${r}">

                                    </option>



                                </select>


                            </div>








                            <!-- Category -->


                            <div class="col-md-4 mb-3">


                                <label class="form-label fw-semibold">


                                    Category


                                </label>



                                <select class="form-select" th:field="*{category}">



                                    <option value="">

                                        Select Category

                                    </option>



                                    <option th:each="c:${categories}" th:value="${c}" th:text="${c}">

                                    </option>



                                </select>


                            </div>







                            <!-- Aadhaar -->


                            <div class="col-md-4 mb-3">


                                <label class="form-label fw-semibold">


                                    Aadhaar Number


                                </label>




                                <input type="text" class="form-control aadhaar-input" id="aadhaarNumber"
                                    th:field="*{aadhaarNumber}" placeholder="1234 5678 9012"
                                    data-check-url="/students/check/aadhaar" th:data-id="${student.id}">





                                <div class="text-danger small" th:errors="*{aadhaarNumber}">

                                </div>




                            </div>







                            <!-- Remarks -->

                            <div class="col-12 mb-3">


                                <label class="form-label fw-semibold">


                                    Remarks


                                </label>




                                <textarea class="form-control" rows="3" th:field="*{remarks}"
                                    placeholder="Remarks"></textarea>




                            </div>





                        </div>


                    </div>


                </div>








                <!-- ======================================================= -->
                <!-- ACTION BUTTONS -->
                <!-- ======================================================= -->


                <div class="sms-card mb-4">


                    <div class="p-3">


                        <div class="d-flex justify-content-end gap-2">





                            <a th:href="@{/students}" class="btn btn-outline-secondary">


                                <i class="bi bi-x-circle me-2"></i>


                                Cancel


                            </a>







                            <button type="submit" class="btn btn-primary">



                                <i class="bi bi-check-circle me-2"></i>



                                <span th:text="${student.id==null ?

'Save Student' :

'Update Student'}">

                                </span>



                            </button>




                        </div>


                    </div>


                </div>





            </form>


        </div>


    </main>







    <div th:replace="~{fragments/footer :: footer}"></div>


    <div th:replace="~{fragments/scripts :: scripts}"></div>





</body>


</html>
