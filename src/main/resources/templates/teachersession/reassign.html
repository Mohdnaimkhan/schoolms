<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-arrow-repeat me-2"></i>

                    Reassign Teacher

                </h2>

                <p class="text-secondary mb-0">

                    Carry a Teacher's Assignments Forward to a New Academic Session

                </p>

            </div>

            <a th:href="@{/teacher-sessions}" class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <form th:action="@{/teacher-sessions/reassign/review}" method="get">

                    <div class="row g-4">

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">

                                Teacher
                                <span class="text-danger">*</span>

                            </label>

                            <select name="teacherId" class="form-select" required>

                                <option value="">-- Select Teacher --</option>

                                <option th:each="t : ${teachers}"
                                        th:value="${t.id}"
                                        th:text="${t.teacherName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">

                                From Session
                                <span class="text-danger">*</span>

                            </label>

                            <select name="fromSessionId" class="form-select" required>

                                <option value="">-- Select Session --</option>

                                <option th:each="as : ${academicSessions}"
                                        th:value="${as.id}"
                                        th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">

                                To Session
                                <span class="text-danger">*</span>

                            </label>

                            <select name="toSessionId" class="form-select" required>

                                <option value="">-- Select Session --</option>

                                <option th:each="as : ${academicSessions}"
                                        th:value="${as.id}"
                                        th:text="${as.sessionName}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-arrow-right-circle me-2"></i>

                            Continue

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
