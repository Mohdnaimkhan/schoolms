<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title mb-0"
                    th:text="${teacher.teacherName}">
                </h2>

                <p class="text-secondary mb-0">

                    Employee Code: <span th:text="${teacher.employeeCode ?: '--'}"></span>
                    - Subject / Class Assignment History

                </p>

            </div>

            <div class="d-flex gap-2">

                <a th:href="@{/teachers}" class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-2"></i>

                    Back

                </a>

            </div>

        </div>

        <div class="sms-card">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>

                    <tr>

                        <th>#</th>
                        <th>Academic Session</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Placement</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="h, stat : ${history}">

                        <td th:text="${stat.count}"></td>

                        <td th:text="${h.academicSession != null ? h.academicSession.sessionName : '--'}"></td>

                        <td th:text="${h.subject != null ? h.subject.subjectName : '--'}"></td>

                        <td th:text="${h.classRoom != null ? h.classRoom.className : '--'}"></td>

                        <td th:text="${h.section != null ? h.section.sectionName : '--'}"></td>

                        <td>

                            <span class="badge bg-primary" th:if="${h.currentSession}">Current</span>

                            <span class="badge bg-secondary" th:unless="${h.currentSession}">Past</span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(history)}">

                        <td colspan="6" class="text-center py-5">

                            <i class="bi bi-inbox display-5"></i>

                            <br><br>

                            No Session History Found for this Teacher

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
