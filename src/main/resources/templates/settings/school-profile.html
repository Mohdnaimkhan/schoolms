<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>


    <main class="sms-content">

        <div class="container-fluid">


            <!-- Page Header -->

            <div class="sms-page-header mb-4">

                <div>

                    <h2 class="sms-page-title">

                        <i class="bi bi-building me-2"></i>

                        School Profile

                    </h2>

                    <p class="text-secondary mb-0">

                        Manage school's basic information and branding.

                    </p>

                </div>

            </div>



            <!-- Breadcrumb -->

            <nav aria-label="breadcrumb" class="mb-4">

                <ol class="breadcrumb">

                    <li class="breadcrumb-item">

                        <a th:href="@{/}">
                            Dashboard
                        </a>

                    </li>

                    <li class="breadcrumb-item active">

                        School Profile

                    </li>

                </ol>

            </nav>



            <!-- Form -->

            <form th:action="@{/settings/school/save}" th:object="${school}" method="post"
                enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                <input type="hidden" th:field="*{id}">



                <!-- School Information -->

                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-building me-2 text-primary"></i>

                        School Information

                    </h5>


                    <div class="row g-4">


                        <div class="col-lg-4">

                            <label class="form-label">
                                School Code
                            </label>

                            <input type="text" th:field="*{schoolCode}" class="form-control" readonly>

                        </div>



                        <div class="col-lg-8">

                            <label class="form-label">
                                School Name
                            </label>

                            <input type="text" th:field="*{schoolName}" class="form-control" required>

                        </div>

                        <div class="col-lg-12">

                            <label class="form-label">School Slogan</label>

                            <input type="text" th:field="*{slogan}" class="form-control"
                                   maxlength="255" placeholder="Empowering Minds, Building Futures">

                            <small class="text-secondary">Shown in the school branding and printable documents.</small>

                        </div>



                        <div class="col-lg-4">

                            <label class="form-label">
                                Short Name
                            </label>

                            <input type="text" th:field="*{shortName}" class="form-control">

                        </div>



                        <div class="col-lg-4">

                            <label class="form-label">
                                Board
                            </label>


                            <select th:field="*{board}" class="form-select">

                                <option value="">
                                    Select Board
                                </option>

                                <option value="CBSE">
                                    CBSE
                                </option>

                                <option value="ICSE">
                                    ICSE
                                </option>

                                <option value="State Board">
                                    State Board
                                </option>

                                <option value="IB">
                                    IB
                                </option>

                            </select>


                        </div>



                        <div class="col-lg-4">

                            <label class="form-label">
                                Established Year
                            </label>

                            <input type="number" th:field="*{establishedYear}" class="form-control">

                        </div>



                        <div class="col-lg-6">

                            <label class="form-label">
                                Registration No
                            </label>

                            <input type="text" th:field="*{registrationNo}" class="form-control">

                        </div>



                        <div class="col-lg-6">

                            <label class="form-label">
                                Affiliation No
                            </label>

                            <input type="text" th:field="*{affiliationNo}" class="form-control">

                        </div>


                    </div>

                </div>





                <!-- Contact Information -->


                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-telephone me-2 text-success"></i>

                        Contact Information

                    </h5>


                    <div class="row g-4">


                        <div class="col-lg-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" th:field="*{email}" class="form-control email-input">

                        </div>


                        <div class="col-lg-3">

                            <label class="form-label">
                                Mobile
                            </label>

                            <input type="text" th:field="*{phone}" class="form-control mobile-input">

                        </div>


                        <div class="col-lg-3">

                            <label class="form-label">
                                Alternate Mobile
                            </label>

                            <input type="text" th:field="*{alternatePhone}" class="form-control mobile-input">

                        </div>


                        <div class="col-lg-12">

                            <label class="form-label">
                                Website
                            </label>

                            <input type="text" th:field="*{website}" class="form-control">

                        </div>


                    </div>


                </div>






                <!-- Address -->


                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-geo-alt me-2 text-danger"></i>

                        Address Information

                    </h5>


                    <div class="row g-4">


                        <div class="col-lg-12">

                            <label class="form-label">
                                Address
                            </label>


                            <textarea th:field="*{address}" class="form-control" rows="3"></textarea>

                        </div>


                        <div class="col-lg-4">

                            <label class="form-label">
                                City
                            </label>

                            <input type="text" th:field="*{city}" class="form-control">

                        </div>


                        <div class="col-lg-4">

                            <label class="form-label">
                                District
                            </label>

                            <input type="text" th:field="*{district}" class="form-control">

                        </div>


                        <div class="col-lg-4">

                            <label class="form-label">
                                State
                            </label>

                            <input type="text" th:field="*{state}" class="form-control">

                        </div>


                        <div class="col-lg-6">

                            <label class="form-label">
                                Country
                            </label>

                            <input type="text" th:field="*{country}" class="form-control">

                        </div>


                        <div class="col-lg-6">

                            <label class="form-label">
                                Pin Code
                            </label>

                            <input type="text" th:field="*{pinCode}" class="form-control">

                        </div>


                    </div>


                </div>






                <!-- Principal -->


                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-person-badge me-2 text-warning"></i>

                        Principal Details

                    </h5>


                    <div class="row g-4">


                        <div class="col-lg-6">

                            <label class="form-label">
                                Principal Name
                            </label>

                            <input type="text" th:field="*{principalName}" class="form-control name-input">

                        </div>


                        <div class="col-lg-6">

                            <label class="form-label">
                                Principal Mobile
                            </label>

                            <input type="text" th:field="*{principalMobile}" class="form-control mobile-input">

                        </div>


                    </div>


                </div>






                <!-- Branding -->


                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-image me-2 text-info"></i>

                        Branding

                    </h5>

                    <div class="row g-4">

                        <!-- School Logo -->
                        <div class="col-lg-6">

                            <label class="form-label fw-semibold">
                                School Logo
                            </label>

                            <div class="text-center">

                                <!-- Fixed Preview Box -->
                                <div class="border rounded d-flex align-items-center justify-content-center bg-light mb-3"
                                    style="height:220px; width:220px; margin:auto;">

                                    <img id="logoPreview" th:src="${school.logo != null}
                        ? @{/uploads/school/{img}(img=${school.logo})}
                        : @{/images/no-image.png}" class="img" style="width:150px;
                height:150px;
                object-fit:contain;">

                                </div>

                                <input type="file" id="logoFile" name="logoFile" accept="image/*" class="form-control">

                                <small class="text-muted">
                                    JPG, PNG (Max 2 MB)
                                </small>

                            </div>

                        </div>

                        <!-- Principal Signature -->
                        <div class="col-lg-6">

                            <label class="form-label fw-semibold">
                                Principal Signature
                            </label>

                            <div class="text-center">

                                <!-- Same Height Preview Box -->
                                <div class="border rounded d-flex align-items-center justify-content-center bg-light mb-3"
                                    style="height:220px; width:220px; margin:auto;">

                                    <img id="signaturePreview" th:src="${school.principalSignature != null}
                        ? @{/uploads/school/{img}(img=${school.principalSignature})}
                        : @{/images/no-image.png}" style="width:150px;
                height:70px;
                object-fit:contain;">

                                </div>

                                <input type="file" id="signatureFile" name="signatureFile" accept="image/*"
                                    class="form-control">

                                <small class="text-muted">
                                    JPG, PNG (Max 2 MB)
                                </small>

                            </div>

                        </div>

                    </div>


                </div>






                <!-- Other -->


                <div class="sms-card mb-4 p-3">


                    <h5 class="fw-semibold mb-4">

                        <i class="bi bi-gear me-2"></i>

                        Other Information

                    </h5>


                    <textarea th:field="*{remarks}" rows="4" class="form-control mb-3"></textarea>


                    <div class="form-check form-switch">

                        <input class="form-check-input" type="checkbox" th:field="*{active}">


                        <label class="form-check-label">

                            Active School

                        </label>

                    </div>


                </div>





                <!-- Buttons -->


                <div class="d-flex justify-content-end gap-2 mb-4">


                    <button type="reset" class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-counterclockwise me-2"></i>

                        Reset

                    </button>



                    <button type="submit" class="btn btn-primary">

                        <i class="bi bi-check-circle me-2"></i>

                        Save Changes

                    </button>


                </div>



            </form>


        </div>


    </main>



    <div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>


</body>

</html>
