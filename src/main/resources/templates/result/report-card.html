<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="sms-content">

    <div class="container-fluid">

        <div class="sms-page-header mb-4">

            <div>

                <h2 class="sms-page-title">

                    <i class="bi bi-file-earmark-text me-2"></i>

                    Report Card

                </h2>

                <p class="text-secondary mb-0" th:if="${studentSession != null}">

                    <span th:text="${studentSession.student != null ? studentSession.student.studentName : '--'}"></span>
                    -
                    <span th:text="${studentSession.classRoom != null ? studentSession.classRoom.className : '--'}"></span>
                    <span th:if="${studentSession.section != null}">
                        (<span th:text="${studentSession.section.sectionName}"></span>)
                    </span>
                    -
                    <span th:text="${studentSession.academicSession != null ? studentSession.academicSession.sessionName : '--'}"></span>

                </p>

            </div>

            <div class="d-flex gap-2">

                <button onclick="window.print()" class="btn btn-success">

                    <i class="bi bi-printer me-2"></i>

                    Print

                </button>

                <a th:if="${studentSession != null and studentSession.student != null}"
                   th:href="@{'/students/view/' + ${studentSession.student.id}}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-2"></i>

                    Back

                </a>

            </div>

        </div>

        <div class="sms-card">

            <div class="p-3">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                        <tr>

                            <th>Subject</th>
                            <th>Max Marks</th>
                            <th>Pass Marks</th>
                            <th>Marks Obtained</th>
                            <th>Result</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="r : ${results}">

                            <td th:text="${r.examSubject != null && r.examSubject.subject != null ? r.examSubject.subject.subjectName : '--'}"></td>

                            <td th:text="${r.examSubject != null ? r.examSubject.maxMarks : '--'}"></td>

                            <td th:text="${r.examSubject != null ? r.examSubject.passMarks : '--'}"></td>

                            <td th:text="${r.marksObtained}"></td>

                            <td>

                                <span class="badge bg-success" th:if="${r.passed}">
                                    Pass
                                </span>

                                <span class="badge bg-danger" th:unless="${r.passed}">
                                    Fail
                                </span>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(results)}">

                            <td colspan="5" class="text-center py-5">

                                <i class="bi bi-inbox display-5"></i>

                                <br><br>

                                No Marks Entered Yet for this Exam

                            </td>

                        </tr>

                        </tbody>

                        <tfoot th:if="${!#lists.isEmpty(results)}">

                        <tr class="fw-bold">

                            <td>Total</td>

                            <td th:text="${totalMax}"></td>

                            <td>--</td>

                            <td th:text="${totalObtained}"></td>

                            <td th:text="${percentage != null ? percentage + '%' : '--'}"></td>

                        </tr>

                        </tfoot>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>

</html>
