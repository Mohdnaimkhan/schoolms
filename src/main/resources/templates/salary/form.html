<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="sms-content"><div class="container-fluid"><div class="sms-page-header mb-4"><h2 class="sms-page-title" th:text="${ledger.id == null ? 'Add Salary Ledger' : 'Edit Salary Ledger'}"></h2><a th:href="@{/salary}" class="btn btn-outline-secondary">Back</a></div><div class="sms-card p-3"><form th:action="@{/salary/save}" th:object="${ledger}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Teacher *</label><select name="teacherId" class="form-select" required><option value="">Select Teacher</option><option th:each="t : ${teachers}" th:value="${t.id}" th:selected="${ledger.teacher != null and ledger.teacher.id == t.id}" th:text="${t.teacherName}"></option></select></div><div class="col-md-6"><label class="form-label">Salary Month *</label><input type="date" class="form-control" th:field="*{salaryMonth}" required></div><div class="col-md-4"><label class="form-label">Basic Salary</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{basicSalary}" required></div><div class="col-md-4"><label class="form-label">Allowances</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{allowances}" required></div><div class="col-md-4"><label class="form-label">Deductions</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{deductions}" required></div></div><hr class="my-4"><div class="d-flex justify-content-end gap-2"><a th:href="@{/salary}" class="btn btn-outline-secondary">Cancel</a><button class="btn btn-primary">Save Salary</button></div></form></div></div></main><div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/footer :: footer}"></div><div th:replace="~{fragments/scripts :: scripts}"></div></body></html>
