<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="sms-content">
        <div class="container-fluid">
            <div class="sms-page-header mb-4">
                <div>
                    <h2 class="sms-page-title"><i class="bi bi-wallet2 me-2"></i>Teacher Salary Ledger</h2>
                    <p class="text-secondary mb-0">Monthly salary, payments and outstanding dues.</p>
                </div>
                <a th:if="${isAdmin or isStaff}" th:href="@{/salary/add}" class="btn btn-primary"><i
                        class="bi bi-plus-circle me-2"></i>Add Salary</a>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="module-stat-card">
                        <div class="module-stat-body"><span class="module-stat-label">Net Salary</span><strong
                                class="module-stat-value" th:text="${totalNet}">0</strong></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="module-stat-card">
                        <div class="module-stat-body"><span class="module-stat-label">Paid</span><strong
                                class="module-stat-value text-success" th:text="${totalPaid}">0</strong></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="module-stat-card">
                        <div class="module-stat-body"><span class="module-stat-label">Due</span><strong
                                class="module-stat-value text-danger" th:text="${totalDue}">0</strong></div>
                    </div>
                </div>
            </div>
            <div class="sms-card mb-4 p-3">
                <form method="get" th:action="@{/salary}" class="row g-2 align-items-end">
                    <div class="col-md-5" th:if="${teachers != null}"><label
                            class="form-label fw-semibold">Teacher</label><select name="teacherId" class="form-select">
                            <option value="">All Teachers</option>
                            <option th:each="t : ${teachers}" th:value="${t.id}"
                                th:selected="${selectedTeacherId != null and selectedTeacherId == t.id}"
                                th:text="${t.teacherName}"></option>
                        </select></div>
                    <div class="col-md-3"><label class="form-label fw-semibold">Status</label><select name="status"
                            class="form-select">
                            <option value="">All Status</option>
                            <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Pending</option>
                            <option value="PARTIAL" th:selected="${selectedStatus == 'PARTIAL'}">Partial</option>
                            <option value="PAID" th:selected="${selectedStatus == 'PAID'}">Paid</option>
                        </select></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div>
                    <div class="col-md-2"><a th:href="@{/salary}" class="btn btn-outline-secondary w-100">Reset</a>
                    </div>
                </form>
            </div>
            <!-- search module -->
            <div class="card shadow-sm mb-4 module-search-toolbar" data-module-search>

                <div class="card-header">
                    <i class="bi bi-search me-2"></i>
                    Search
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">

                            <div class="input-group w-90">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="search" class="form-control module-search-input border border-1"
                                    placeholder="Type to search..." autocomplete="off" spellcheck="false">

                            </div>

                            <div class="small text-secondary mt-2 module-search-count"></div>

                        </div>

                    </div>

                </div>

            </div>
            <div class="sms-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" data-module-search-table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Teacher</th>
                                <th>Month</th>
                                <th>Net</th>
                                <th>Paid</th>
                                <th>Due</th>
                                <th>Status</th>
                                <th width="210" >Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l,stat : ${ledgers}">
                                <td th:text="${stat.count}"></td>
                                <td th:text="${l.teacher.teacherName}"></td>
                                <td th:text="${#temporals.format(l.salaryMonth,'MMM yyyy')}"></td>
                                <td th:text="${l.netSalary}"></td>
                                <td th:text="${l.paidAmount}"></td>
                                <td th:text="${l.dueAmount}"></td>
                                <td>
                                    <span class="badge bg-success" th:if="${l.status == 'PAID'}">Paid</span><span
                                        class="badge bg-warning text-dark"
                                        th:if="${l.status == 'PARTIAL'}">Partial</span><span class="badge bg-danger"
                                        th:if="${l.status == 'PENDING'}">Pending</span></td>
                                <td ><a th:href="@{'/salary/' + ${l.id} + '/view'}"
                                        class="btn btn-outline-primary btn-sm"><i class="bi bi-eye"></i></a><a
                                        th:if="${isAdmin or isStaff}" th:href="@{'/salary/' + ${l.id} + '/payment/add'}"
                                        class="btn btn-success btn-sm"><i class="bi bi-cash-stack"></i></a><a
                                        th:if="${isAdmin or isStaff}" th:href="@{'/salary/edit/' + ${l.id}}"
                                        class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ledgers)}">
                                <td colspan="8" class="text-center py-4 text-secondary">No salary records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
