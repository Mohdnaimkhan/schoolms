<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="sms-content"><div class="container-fluid"><div class="sms-page-header mb-4"><div><h2 class="sms-page-title">Salary Ledger</h2><p class="text-secondary mb-0" th:text="${ledger.teacher.teacherName + ' • ' + #temporals.format(ledger.salaryMonth,'MMM yyyy')}"></p></div><a th:href="@{/salary}" class="btn btn-outline-secondary">Back</a></div><div class="row g-3 mb-4"><div class="col-md-3"><div class="module-stat-card"><div class="module-stat-body"><span class="module-stat-label">Basic</span><strong class="module-stat-value" th:text="${ledger.basicSalary}"></strong></div></div></div><div class="col-md-3"><div class="module-stat-card"><div class="module-stat-body"><span class="module-stat-label">Allowances</span><strong class="module-stat-value" th:text="${ledger.allowances}"></strong></div></div></div><div class="col-md-3"><div class="module-stat-card"><div class="module-stat-body"><span class="module-stat-label">Net</span><strong class="module-stat-value" th:text="${ledger.netSalary}"></strong></div></div></div><div class="col-md-3"><div class="module-stat-card"><div class="module-stat-body"><span class="module-stat-label">Due</span><strong class="module-stat-value text-danger" th:text="${ledger.dueAmount}"></strong></div></div></div></div><div class="sms-card"><div class="p-3 d-flex justify-content-between align-items-center"><h5 class="mb-0">Payment History</h5><a th:if="${isAdmin or isStaff}" th:href="@{'/salary/' + ${ledger.id} + '/payment/add'}" class="btn btn-success btn-sm">Add Payment</a></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Remarks</th><th>Expense</th><th th:if="${isAdmin or isStaff}">Action</th></tr></thead><tbody><tr th:each="p : ${ledger.payments}"><td th:text="${p.paymentDate}"></td><td th:text="${p.amount}"></td><td th:text="${p.paymentMode ?: '—'}"></td><td th:text="${p.remarks ?: '—'}"></td><td><span class="badge bg-success">Recorded</span></td><td th:if="${isAdmin or isStaff}"><a th:href="@{'/salary/payment/edit/' + ${p.id}}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a> <form th:action="@{/salary/payment/delete/{id}(id=${p.id})}" method="post"><input type="hidden" name="ledgerId" th:value="${ledger.id}"><button class="btn btn-danger btn-sm" onclick="return confirm('Delete this payment and its linked expense?')"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(ledger.payments)}"><td colspan="6" class="text-center py-4 text-secondary">No payments recorded.</td></tr></tbody></table></div></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><div th:replace="~{fragments/scripts :: scripts}"></div></body></html>
