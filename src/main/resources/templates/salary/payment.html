<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="sms-content"><div class="container-fluid"><div class="sms-page-header mb-4"><div><h2 class="sms-page-title">Salary Payment</h2><p class="text-secondary mb-0" th:text="${ledger.teacher.teacherName + ' • ' + #temporals.format(ledger.salaryMonth,'MMM yyyy') + ' • Due: ' + ledger.dueAmount}"></p></div><a th:href="@{'/salary/' + ${ledger.id} + '/view'}" class="btn btn-outline-secondary">Back</a></div><div class="sms-card p-3"><form th:action="@{'/salary/' + ${ledger.id} + '/payment/save'}" th:object="${payment}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Amount *</label><input type="number" step="0.01" min="0.01" th:field="*{amount}" class="form-control" required></div><div class="col-md-6"><label class="form-label">Payment Date *</label><input type="date" th:field="*{paymentDate}" class="form-control" required></div><div class="col-md-6"><label class="form-label">Payment Mode</label><select th:field="*{paymentMode}" class="form-select"><option value="">Select</option><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Cheque</option></select></div><div class="col-12"><label class="form-label">Remarks</label><textarea th:field="*{remarks}" class="form-control" rows="3"></textarea></div></div><hr class="my-4"><button class="btn btn-success float-end"><i class="bi bi-cash-stack me-2"></i>Save Payment</button></form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><div th:replace="~{fragments/scripts :: scripts}"></div></body></html>
